# CI for a solo Android project. Advisory on a private GitHub Free repo
# (no required checks): the rule is "don't merge red".
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bar:
    # Flags changes that make checks easier to pass instead of fixing the code.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/check-bar.sh "origin/${{ github.base_ref }}"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # match the Gradle toolchain version
      - uses: gradle/actions/setup-gradle@v4
      # Same checks as /verify, plus screenshot tests. Task names depend on
      # the project's setup (ktlint plugin; screenshot plugin vs AGP test suites).
      - run: ./gradlew ktlintCheck lintDebug testDebugUnitTest validateDebugScreenshotTest assembleDebug --continue
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"
